<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Producto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/detalle.css">
</head>
<body>
  <div class="animated-bg"></div>
  <div class="detalle-container">
    <div class="card w-100 animated-card">
      <img src="img/4.png" class="card-img-top" alt="Producto" id="imgProducto">
      <div class="card-body">
        <h5 class="card-title" id="nombreProducto">Producto</h5>
        <p class="card-text" id="descripcionProducto"></p>
        <p class="card-text"><strong id="precioProducto"></strong></p>
        <button class="btn btn-chat w-100" onclick="mostrarLoader()">Iniciar chat</button>
      </div>
    </div>
  </div>
  <div id="loaderOverlay">
    <div class="text-center">
      <img src="img/logo-interagro.png" alt="Logo" class="logo">
      <div class="spinner-border text-success" role="status"></div>
      <div class="meta">Cargando...</div>
    </div>
  </div>
  <script src="detalle.js"></script>
</body>
</html>
