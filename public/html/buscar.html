<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar | InterAgro</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/interagro-theme.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/buscar.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <!-- Menú lateral global -->
  <div id="sidebar-container"></div>
  <main class="main-content">
    <div class="search-container mb-4">
      <div class="input-group">
        <input type="text" class="form-control" placeholder="¿Qué buscas hoy?" aria-label="Buscar productos">
        <button class="btn btn-success" type="button">
          <i class="fas fa-search"></i> Buscar
        </button>
      </div>
    </div>

    <div class="row">
      <!-- Resultados -->
      <div class="col-12 col-md-9">
        <div class="results-header d-flex justify-content-between align-items-center mb-4">
          <div>
            <p class="mb-0 text-muted">Mostrando 20 resultados</p>
          </div>
          <div class="d-flex gap-2 align-items-center">
            <label for="sortSelect" class="text-muted mb-0 me-2">Ordenar por:</label>
            <select class="form-select form-select-sm" id="sortSelect">
              <option>Más relevantes</option>
              <option>Menor precio</option>
              <option>Mayor precio</option>
              <option>Más recientes</option>
            </select>
          </div>
        </div>

        <div class="products-grid">
          <!-- Producto -->
          <div>
            <div class="card h-100 product-card">
              <div class="position-relative">
                <img src="../img/placeholder.jpg" class="card-img-top" alt="Producto">
                <span class="badge bg-success position-absolute top-0 end-0 m-2">Nuevo</span>
              </div>
              <div class="card-body">
                <h5 class="card-title">Producto Agrícola</h5>
                <p class="text-success fw-bold mb-1">$99.99</p>
                <p class="card-text text-muted small">Descripción corta del producto agrícola</p>
                <div class="d-flex justify-content-between align-items-center">
                  <span class="text-muted small"><i class="fas fa-map-marker-alt"></i> Ubicación</span>
                  <button class="btn btn-outline-success btn-sm">Ver detalles</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Filtros -->
      <div class="col-12 col-md-3">
        <div class="filter-section card">
          <div class="card-body">
            <h5 class="card-title fw-bold text-success">Filtrar por:</h5>
            
            <div class="mb-4">
              <h6 class="fw-bold">Categorías</h6>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="cat1">
                <label class="form-check-label" for="cat1">Semillas</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="cat2">
                <label class="form-check-label" for="cat2">Herramientas</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="cat3">
                <label class="form-check-label" for="cat3">Fertilizantes</label>
              </div>
            </div>

            <div class="mb-4">
              <h6 class="fw-bold">Precio</h6>
              <div class="range-slider">
                <input type="range" class="form-range" min="0" max="1000" id="priceRange">
                <div class="price-inputs d-flex gap-2">
                  <input type="number" class="form-control form-control-sm" placeholder="Min">
                  <input type="number" class="form-control form-control-sm" placeholder="Max">
                </div>
              </div>
            </div>

            <div class="mb-4">
              <h6 class="fw-bold">Ubicación</h6>
              <select class="form-select">
                <option selected>Todas las ubicaciones</option>
                <option>Departamento 1</option>
                <option>Departamento 2</option>
                <option>Departamento 3</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      </div>
    </div>
  </main>
  <!-- Menú Más global -->
  <button class="btn btn-dark mas-btn" id="btnMas">
    <span style="font-weight:700;">Más</span>
  </button>
  <div id="menu-mas-container"></div>
<script>
// Cargar menú lateral global
fetch('../html/sidebar.html')
  .then(res => res.text())
  .then(html => {
    document.getElementById('sidebar-container').innerHTML = html;
  });

// Cargar menú Más global
fetch('../html/menu-mas.html')
  .then(res => res.text())
  .then(html => {
    document.getElementById('menu-mas-container').innerHTML = html;
    // Lógica para mostrar/ocultar menú Más
    const btnMas = document.getElementById('btnMas');
    const menuMas = document.getElementById('menuMas');
    let menuMasVisible = false;
    btnMas.addEventListener('click', function(e) {
      e.stopPropagation();
      menuMas.style.display = menuMasVisible ? 'none' : 'block';
      menuMasVisible = !menuMasVisible;
    });
    document.addEventListener('click', function(e) {
      if (menuMasVisible && !menuMas.contains(e.target) && e.target !== btnMas) {
        menuMas.style.display = 'none';
        menuMasVisible = false;
      }
    });
    window.addEventListener('scroll', function() {
      if (menuMasVisible) {
        menuMas.style.display = 'none';
        menuMasVisible = false;
      }
    });
  });
</script>
<script src="../js/buscar.js"></script>
</body>
</html>
