<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar | InterAgro</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/interagro-theme.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/buscar.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <!-- Menú lateral global -->
  <div id="sidebar-container"></div>
  <main class="main-content">
    <div class="search-container mb-4">
      <div class="input-group">
        <input type="text" class="form-control" placeholder="¿Qué buscas hoy?" aria-label="Buscar productos">
        <button class="btn btn-success" type="button">
          <i class="fas fa-search"></i> Buscar
        </button>
      </div>
    </div>

    <div class="row">
      <!-- Resultados -->
      <div class="col-12 col-md-9">
        <div class="results-header d-flex justify-content-between align-items-center mb-4">
          <div>
            <p class="mb-0 text-muted">Mostrando 20 resultados</p>
          </div>
          <div class="d-flex gap-2 align-items-center">
            <label for="sortSelect" class="text-muted mb-0 me-2">Ordenar por:</label>
            <select class="form-select form-select-sm" id="sortSelect">
              <option>Más relevantes</option>
              <option>Menor precio</option>
              <option>Mayor precio</option>
              <option>Más recientes</option>
            </select>
          </div>
        </div>

        <div class="products-grid"></div>
      </div>

      <!-- Filtros -->
      <div class="col-12 col-md-3">
        <div class="filter-section card">
          <div class="card-body">
            <h5 class="card-title fw-bold text-success">Filtrar por:</h5>
            
            <div class="mb-4">
              <h6 class="fw-bold">Categorías</h6>

              <div class="category-group mb-2">
                <h6 class="small fw-bold">Frutas y Verduras</h6>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="cat-frutas" value="Frutas">
                  <label class="form-check-label" for="cat-frutas">Frutas</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="cat-verduras" value="Verduras">
                  <label class="form-check-label" for="cat-verduras">Verduras</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="cat-tuberculos" value="Tubérculos">
                  <label class="form-check-label" for="cat-tuberculos">Tubérculos</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="cat-legumbres" value="Legumbres">
                  <label class="form-check-label" for="cat-legumbres">Legumbres</label>
                </div>
              </div>

              <div class="category-group mb-2">
                <h6 class="small fw-bold">Cereales y Plantas</h6>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="cat-cereales" value="Cereales">
                  <label class="form-check-label" for="cat-cereales">Cereales</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="cat-plantas" value="Plantas Aromáticas">
                  <label class="form-check-label" for="cat-plantas">Plantas Aromáticas</label>
                </div>
              </div>

              <div class="category-group mb-2">
                <h6 class="small fw-bold">Animales y Derivados</h6>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="cat-animales" value="Animales">
                  <label class="form-check-label" for="cat-animales">Animales</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="cat-lacteos" value="Lácteos">
                  <label class="form-check-label" for="cat-lacteos">Lácteos</label>
                </div>
              </div>

              <div class="category-group">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="cat-otra" value="Otra">
                  <label class="form-check-label" for="cat-otra">Otra...</label>
                </div>
              </div>
            </div>

            <div class="mb-4">
              <h6 class="fw-bold">Precio</h6>
              <div class="range-slider">
                <input type="range" class="form-range" min="0" max="1000" id="priceRange" aria-label="Rango de precio">
                <div class="price-inputs d-flex gap-2">
                  <input type="number" class="form-control form-control-sm" placeholder="Min" aria-label="Precio mínimo">
                  <input type="number" class="form-control form-control-sm" placeholder="Max" aria-label="Precio máximo">
                </div>
              </div>
            </div>

            <div class="mb-4">
              <h6 class="fw-bold">Ubicación</h6>
              <select class="form-select" aria-label="Seleccionar ubicación">
                <option selected>Todas las ubicaciones</option>
                <option>Departamento 1</option>
                <option>Departamento 2</option>
                <option>Departamento 3</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      </div>
    </div>
  </main>
  <!-- Menú Más global -->
  <button class="btn btn-dark mas-btn" id="btnMas">
    <span class="fw-bold">Más</span>
  </button>
  <div id="menu-mas-container"></div>
<script>
// Cargar menú lateral global
fetch('../html/sidebar.html')
  .then(res => res.text())
  .then(html => {
    document.getElementById('sidebar-container').innerHTML = html;
  });

// Cargar menú Más global
fetch('../html/menu-mas.html')
  .then(res => res.text())
  .then(html => {
    document.getElementById('menu-mas-container').innerHTML = html;
    // Lógica para mostrar/ocultar menú Más
    const btnMas = document.getElementById('btnMas');
    const menuMas = document.getElementById('menuMas');
    let menuMasVisible = false;
    btnMas.addEventListener('click', function(e) {
      e.stopPropagation();
      menuMas.style.display = menuMasVisible ? 'none' : 'block';
      menuMasVisible = !menuMasVisible;
    });
    document.addEventListener('click', function(e) {
      if (menuMasVisible && !menuMas.contains(e.target) && e.target !== btnMas) {
        menuMas.style.display = 'none';
        menuMasVisible = false;
      }
    });
    window.addEventListener('scroll', function() {
      if (menuMasVisible) {
        menuMas.style.display = 'none';
        menuMasVisible = false;
      }
    });
  });
</script>
<script src="../js/buscar.js"></script>
</body>
</html>
