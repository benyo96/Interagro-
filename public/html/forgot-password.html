<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña - Interagro</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-p0Z5+g1Hya2XurUQflTn0gjxcjvZXb3nu0z9C97dyFplbWp3Xbp1INTCmb5C4AG61u3R0GCG1Qh2gtj7f3l2Bg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="auth-page">
  <main class="page">
    <div class="auth-shell">
      <div class="auth-card">
        <h2>Recuperar contraseña</h2>
        <p>Ingresa tu correo y la nueva contraseña para actualizar tu cuenta.</p>
        <form id="forgotForm">
          <label class="field">
            <span>Correo</span>
            <input type="email" id="email" placeholder="correo@ejemplo.com" required>
          </label>
          <label class="field">
            <span>Nueva contraseña</span>
            <input type="password" id="newPassword" placeholder="Mínimo 6 caracteres" required>
          </label>
          <button type="submit" class="btn btn-primary">Actualizar contraseña</button>
        </form>
        <p class="text-center"><a href="login.html">Regresar a iniciar sesión</a></p>
        <p id="message" class="form-message"></p>
      </div>
    </div>
  </main>
  <script src="../js/forgot-password-app.js"></script>
</body>
</html>
