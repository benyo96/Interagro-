<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Producto | InterAgro</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/buscar.css">
  <link rel="stylesheet" href="../css/detalle.css">
  <link rel="stylesheet" href="../css/interagro-theme.css">
  <link rel="stylesheet" href="../css/sidebar.css">
</head>
<body>
  <!-- header-logo eliminado para evitar texto flotante -->
  <div class="main-content">
    <aside class="sidebar">
      <img src="../img/agricultor.png" alt="Logo" class="logo">
      <h4 style="font-family: 'Montserrat', sans-serif; color:#4caf50;">InterAgro</h4>
      <nav>
        <a href="inicio.html"><span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#4caf50" width="28" height="28"><path d="M12 3l9 8h-3v7h-4v-5h-4v5H6v-7H3z"/></svg></span> <span style="font-family: 'Montserrat', sans-serif;">Inicio</span></a>
        <a href="buscar.html"><span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#4caf50" width="28" height="28"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99c.41.41 1.09.41 1.5 0s.41-1.09 0-1.5l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span> <span style="font-family: 'Montserrat', sans-serif;">Buscar</span></a>
        <a href="mensajes.html"><span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#4caf50" width="28" height="28"><path d="M20 2H4c-1.1 0-2 .9-2 2v16l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 12H6l-4 4V4h18v10z"/></svg></span> <span style="font-family: 'Montserrat', sans-serif;">Mensajes</span></a>
        <a href="perfil.html"><img src="../img/agricultor.png" style="width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;" class="me-2"> <span style="font-family: 'Montserrat', sans-serif;">Perfil</span></a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="detalle-container">
        <div class="card w-100 animated-card">
          <img src="../img/4.png" class="card-img-top" alt="Producto" id="imgProducto">
          <div class="card-body">
            <h5 class="card-title" id="nombreProducto">Producto</h5>
            <p class="card-text" id="descripcionProducto"></p>
            <p class="card-text"><strong id="precioProducto"></strong></p>
            <button class="btn btn-chat w-100" onclick="mostrarLoader()">Iniciar chat</button>
          </div>
        </div>
      </div>
      <div id="loaderOverlay">
        <div class="text-center">
          <img src="../img/logo-interagro.png" alt="Logo" class="logo">
          <div class="spinner-border text-success" role="status"></div>
          <div class="meta">Cargando...</div>
        </div>
      </div>
      <div id="modalConstruccion" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.4);z-index:2000;align-items:center;justify-content:center;">
        <div style="background:#fff;padding:32px 40px;border-radius:18px;box-shadow:0 2px 24px #0006;max-width:90vw;text-align:center;">
          <h4 style="color:#4caf50;">Función en construcción</h4>
          <p>Esta sección estará disponible próximamente.</p>
          <button onclick="document.getElementById('modalConstruccion').style.display='none'" class="btn btn-success mt-2">Cerrar</button>
        </div>
      </div>

  <button class="btn btn-dark mas-btn" id="btnMas" style="position:fixed;bottom:24px;font-family:'Montserrat',sans-serif;font-weight:700;display:flex;align-items:center;gap:8px;border-radius:10px;box-shadow:0 2px 8px #0002;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#fff" width="22" height="22"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
        Más
      </button>

  <div id="menuMas" class="menu-mas" style="display:none; position:fixed; bottom:70px; min-width:220px; background:#222; color:#fff; border-radius:18px; box-shadow:0 2px 24px #0006; padding:12px 0; font-family:'Montserrat',sans-serif;">
        <a href="inicio.html" class="menu-mas-item" style="display:flex;align-items:center;padding:10px 24px;text-decoration:none;color:#fff;gap:12px;">
          <span><svg xmlns="http://www.w3.org/2000/svg" fill="#4caf50" width="22" height="22" viewBox="0 0 24 24"><path d="M12 3l9 8h-3v7h-4v-5h-4v5H6v-7H3z"/></svg></span> Inicio
        </a>
        <a href="configuracion.html" class="menu-mas-item" style="display:flex;align-items:center;padding:10px 24px;text-decoration:none;color:#fff;gap:12px;">
          <span><!-- icono --></span> Configuración
        </a>
        <a href="actividad.html" class="menu-mas-item" id="actividadBtn" style="display:flex;align-items:center;padding:10px 24px;text-decoration:none;color:#fff;gap:12px;">
          <span><!-- icono --></span> Tu actividad
        </a>
        <a href="guardado.html" class="menu-mas-item" id="guardadoBtn" style="display:flex;align-items:center;padding:10px 24px;text-decoration:none;color:#fff;gap:12px;">
          <span><!-- icono --></span> Guardado
        </a>
        <a href="apariencia.html" class="menu-mas-item" id="aparienciaBtn" style="display:flex;align-items:center;padding:10px 24px;text-decoration:none;color:#fff;gap:12px;">
          <span><!-- icono --></span> Cambiar apariencia
        </a>
        <a href="reporte.html" class="menu-mas-item" id="reporteBtn" style="display:flex;align-items:center;padding:10px 24px;text-decoration:none;color:#fff;gap:12px;">
          <span><!-- icono --></span> Reportar un problema
        </a>
        <hr style="margin:8px 0;border-color:#444;">
        <a href="login.html" class="menu-mas-item" id="cambiarCuentaBtn" style="display:flex;align-items:center;padding:10px 24px;text-decoration:none;color:#fff;gap:12px;">
          <span><!-- icono --></span> Cambiar de cuenta
        </a>
        <a href="login.html" class="menu-mas-item" id="salirBtn" style="display:flex;align-items:center;padding:10px 24px;text-decoration:none;color:#fff;gap:12px;">
          <span><!-- icono --></span> Salir
        </a>
      </div>

    </main>
  </div>

  <script src="../js/buscar.js"></script>
  <script src="../js/detalle.js"></script>
  <script>
  function mostrarConstruccion(e) {
    if (e) e.preventDefault();
    document.getElementById('modalConstruccion').style.display = 'flex';
  }
  </script>
  <script src="../js/sidebar.js"></script>
</body>
</html>
