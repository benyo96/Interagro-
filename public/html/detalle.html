si<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Producto | InterAgro</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/interagro-theme.css">
  <link rel="stylesheet" href="../css/sidebar.css">
</head>
<body>
  <!-- header-logo eliminado para evitar texto flotante -->
  <!-- Menú lateral global -->
  <div id="sidebar-container"></div>
  <!-- Menú Más global -->
  <button class="btn btn-dark mas-btn" id="btnMas">
    <span style="font-weight:700;">Más</span>
  </button>
  <div id="menu-mas-container"></div>
  <main class="main-content">
    <div class="detalle-container">
      <div class="card w-100 animated-card">
        <img src="../img/4.png" class="card-img-top" alt="Producto" id="imgProducto">
        <div class="card-body">
          <h5 class="card-title" id="nombreProducto">Producto</h5>
          <p class="card-text" id="descripcionProducto"></p>
          <p class="card-text"><strong id="precioProducto"></strong></p>
          <button class="btn btn-chat w-100" onclick="mostrarLoader()">Iniciar chat</button>
        </div>
      </div>
    </div>
    <div id="loaderOverlay">
      <div class="text-center">
        <img src="../img/logo-interagro.png" alt="Logo" class="logo">
        <div class="spinner-border text-success" role="status"></div>
        <div class="meta">Cargando...</div>
      </div>
    </div>
    <div id="modalConstruccion" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.4);z-index:2000;align-items:center;justify-content:center;">
      <div style="background:#fff;padding:32px 40px;border-radius:18px;box-shadow:0 2px 24px #0006;max-width:90vw;text-align:center;">
        <h4 style="color:#4caf50;">Función en construcción</h4>
        <p>Esta sección estará disponible próximamente.</p>
        <button onclick="document.getElementById('modalConstruccion').style.display='none'" class="btn btn-success mt-2">Cerrar</button>
      </div>
    </div>
  </main>
  <script>
    // Cargar menú lateral global
    fetch('../html/sidebar.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('sidebar-container').innerHTML = html;
      });

    // Cargar menú Más global
    fetch('../html/menu-mas.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('menu-mas-container').innerHTML = html;
        // Lógica para mostrar/ocultar menú Más
        const btnMas = document.getElementById('btnMas');
        const menuMas = document.getElementById('menuMas');
        let menuMasVisible = false;
        btnMas.addEventListener('click', function(e) {
          e.stopPropagation();
          menuMas.style.display = menuMasVisible ? 'none' : 'block';
          menuMasVisible = !menuMasVisible;
        });
        document.addEventListener('click', function(e) {
          if (menuMasVisible && !menuMas.contains(e.target) && e.target !== btnMas) {
            menuMas.style.display = 'none';
            menuMasVisible = false;
          }
        });
        window.addEventListener('scroll', function() {
          if (menuMasVisible) {
            menuMas.style.display = 'none';
            menuMasVisible = false;
          }
        });
      });
  </script>
  <script src="../js/detalle.js"></script>
  <script src="../js/detalle.js"></script>
  <script src="../js/sidebar.js"></script>
</body>
</html>
