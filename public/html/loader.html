<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InterAgro — Cargando</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/loader.css">
  <style>
    /* Minimal logo styling for loader */
    .project-logo {
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 2.1rem;
      color: #2f7a3a; /* darker green for branding */
      letter-spacing: 1px;
      margin-top: 18px;
    }
    .loader-wrapper { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:18px; }
    /* make spinner a bit larger */
    .spinner-border.custom { width:64px; height:64px; border-width:6px; }
  </style>
</head>
<body>
  <div class="loader-wrapper fade-in text-center">
    <div>
      <div class="spinner-border text-success custom" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
    </div>
    <div class="project-logo">InterAgro</div>
  </div>

  <script src="../js/loader.js"></script>
</body>
</html>
