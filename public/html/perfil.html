
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil | InterAgro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/interagro-theme.css">
  <link rel="stylesheet" href="../css/sidebar.css">
</head>
<body>

  <div id="sidebar-container"></div>
  <main class="main-content">
    <div class="perfil-card">
      <img id="perfilFoto" src="../img/agricultor.png" alt="Foto de perfil" class="perfil-foto">
      <button id="btnEditarPerfil" class="btn-editar">Editar perfil</button>
      <div style="width:100%;max-width:420px;margin:0 auto 10px auto;">
        <h5 style="margin:18px 0 4px 0;font-weight:700;color:#4caf50;">Descripción</h5>
        <p id="perfilDescripcion" class="perfil-descripcion">Sin descripción</p>
      </div>
      <div class="perfil-publicaciones-header">
        <h3>Mis publicaciones (<span id="perfilPublicaciones">0</span>)</h3>
        <button id="btnNuevaPublicacion" class="btn-nueva-publicacion">+ Nueva publicación</button>
      </div>
      <div id="publicacionesGrid" class="publicaciones-grid"></div>
    </div>
    <!-- Modal editar perfil -->
    <div id="modalEditarPerfil" class="modal" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;justify-content:center;align-items:center;background:rgba(0,0,0,0.25);z-index:1000;">
      <div class="modal-content" style="background:#fff;padding:24px;border-radius:12px;max-width:350px;width:90vw;box-shadow:0 2px 16px #0002;position:relative;">
        <span class="close" id="cerrarModalEditarPerfil" style="position:absolute;top:12px;right:16px;font-size:1.5em;cursor:pointer;">&times;</span>
        <h4>Editar perfil</h4>
        <label for="inputFotoPerfil" style="font-weight:600;color:#4caf50;margin-bottom:6px;display:block;">Foto de perfil</label>
        <input type="file" id="inputFotoPerfil" accept="image/*" style="margin-bottom:10px;">
        <label for="inputDescripcion" style="font-weight:600;color:#4caf50;margin-bottom:6px;display:block;">Descripción</label>
        <textarea id="inputDescripcion" placeholder="Escribe tu descripción..." style="width:100%;min-height:60px;resize:vertical;"></textarea>
        <button id="guardarDescripcion" class="btn-guardar" style="margin-top:12px;">Guardar</button>
      </div>
    </div>
    <!-- Modal nueva publicación -->
    <div id="modalNuevaPublicacion" class="modal" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;justify-content:center;align-items:center;background:rgba(0,0,0,0.25);z-index:1000;">
      <div class="modal-content" style="background:#fff;padding:24px;border-radius:12px;max-width:350px;width:90vw;box-shadow:0 2px 16px #0002;position:relative;">
        <span class="close" id="cerrarModalNuevaPublicacion" style="position:absolute;top:12px;right:16px;font-size:1.5em;cursor:pointer;">&times;</span>
        <h4>Nueva publicación</h4>
        <div class="modal-publicar-foto-nombre" style="display:flex;align-items:center;margin-bottom:10px;">
          <img id="modalPerfilFoto" src="../img/agricultor.png" alt="Foto de perfil" class="perfil-foto" style="width:56px;height:56px;">
          <span id="modalPerfilNombre" style="font-weight:700;font-size:1.1em;margin-left:10px;">Usuario</span>
        </div>
        <input type="text" id="tituloPublicacion" placeholder="Nombre del producto*" required style="margin-bottom:8px;">
        <input type="text" id="precioPublicacion" placeholder="Precio (COP)*" required autocomplete="off" inputmode="numeric" pattern="[0-9.]*" style="margin-bottom:8px;">
        <div class="publicar-categorias" style="margin-bottom:8px;">
          <label for="categoriaPublicacion" style="font-weight:600;color:#222;margin-bottom:4px;">Categoría</label>
          <select id="categoriaPublicacion" required style="margin-bottom:8px;">
            <optgroup label="Frutas y Verduras">
              <option value="Frutas">Frutas</option>
              <option value="Verduras">Verduras</option>
              <option value="Tubérculos">Tubérculos</option>
              <option value="Legumbres">Legumbres</option>
            </optgroup>
            <optgroup label="Cereales y Plantas">
              <option value="Cereales">Cereales</option>
              <option value="Plantas Aromáticas">Plantas Aromáticas</option>
            </optgroup>
            <optgroup label="Animales y Derivados">
              <option value="Animales">Animales</option>
              <option value="Lácteos">Lácteos</option>
            </optgroup>
            <option value="Otra">Otra...</option>
          </select>
          <input type="text" id="otraCategoriaPublicacion" placeholder="Especifique la categoría" style="display:none;margin-top:8px;">
        </div>
        <textarea id="descPublicacion" placeholder="Descripción del producto (opcional)" style="margin-bottom:8px;"></textarea>
        <input type="file" id="imgPublicacion" accept="image/*" multiple required style="margin-bottom:8px;">
        <button id="publicarBtn" class="btn-guardar">Publicar</button>
      </div>
    </div>
  </main>
  <button class="btn btn-dark mas-btn" id="btnMas">
    <span style="font-weight:700;">Más</span>
  </button>
  <div id="menu-mas-container"></div>
  <script>
    // Cargar menú lateral global
    fetch('../html/sidebar.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('sidebar-container').innerHTML = html;
      });
    // Cargar menú Más global
    fetch('../html/menu-mas.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('menu-mas-container').innerHTML = html;
        const btnMas = document.getElementById('btnMas');
        const menuMas = document.getElementById('menuMas');
        let menuMasVisible = false;
        btnMas.addEventListener('click', function(e) {
          e.stopPropagation();
          menuMas.style.display = menuMasVisible ? 'none' : 'block';
          menuMasVisible = !menuMasVisible;
        });
        document.addEventListener('click', function(e) {
          if (menuMasVisible && !menuMas.contains(e.target) && e.target !== btnMas) {
            menuMas.style.display = 'none';
            menuMasVisible = false;
          }
        });
        window.addEventListener('scroll', function() {
          if (menuMasVisible) {
            menuMas.style.display = 'none';
            menuMasVisible = false;
          }
        });
      });
  </script>
  <script src="../js/perfil.js"></script>
</body>
</html>
