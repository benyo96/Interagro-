
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportar un problema | InterAgro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/interagro-theme.css">
  <link rel="stylesheet" href="../css/sidebar.css">
</head>
<body>
  <div id="sidebar-container"></div>
  <main class="main-content">
    <h2 class="fw-bold">Reportar un problema</h2>
    <form id="formReporte" autocomplete="off">
      <input type="text" id="asuntoReporte" placeholder="¿Sobre qué es tu reporte?" required autofocus>
      <textarea id="descReporte" placeholder="Cuéntanos el problema o sugerencia con detalle..." rows="4" required></textarea>
      <button type="submit">Enviar reporte</button>
    </form>
    <div id="reporteMsg"></div>
  </main>
  <button class="btn btn-dark mas-btn" id="btnMas">
    <span style="font-weight:700;">Más</span>
  </button>
  <div id="menu-mas-container"></div>
  <script>
    // Cargar menú lateral global
    fetch('../html/sidebar.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('sidebar-container').innerHTML = html;
      });
    // Cargar menú Más global
    fetch('../html/menu-mas.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('menu-mas-container').innerHTML = html;
        const btnMas = document.getElementById('btnMas');
        const menuMas = document.getElementById('menuMas');
        let menuMasVisible = false;
        btnMas.addEventListener('click', function(e) {
          e.stopPropagation();
          menuMas.style.display = menuMasVisible ? 'none' : 'block';
          menuMasVisible = !menuMasVisible;
        });
        document.addEventListener('click', function(e) {
          if (menuMasVisible && !menuMas.contains(e.target) && e.target !== btnMas) {
            menuMas.style.display = 'none';
            menuMasVisible = false;
          }
        });
        window.addEventListener('scroll', function() {
          if (menuMasVisible) {
            menuMas.style.display = 'none';
            menuMasVisible = false;
          }
        });
      });
  </script>
  <script src="../js/reporte.js"></script>
</body>
</html>
