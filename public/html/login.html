<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="../css/interagro-theme.css">
</head>
<body>
  <div class="login-container">
    <div class="row w-100 justify-content-center align-items-center">
      <div class="col-md-5 text-center">
  <img src="../img/4.png" alt="Logo InterAgro" class="logo mb-3">
        <div class="card p-4 fade-in">
          <h2 class="mb-4">InterAgro</h2>
          <form id="loginForm">
            <div class="mb-3">
              <input type="text" class="form-control" id="correo" placeholder="Correo electrónico" required>
            </div>
            <div class="mb-3">
              <input type="password" class="form-control" id="contrasena" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="btn btn-success w-100 animated-btn">Entrar</button>
          </form>
          <div class="mt-3 text-center">
            <a href="register.html">¿No tienes una cuenta? Regístrate</a>
          </div>
        </div>
      </div>
      <div class="col-md-5 d-flex justify-content-center align-items-center">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=400&q=80" alt="Side" class="side-img">
      </div>
    </div>
  </div>
  <div id="loaderOverlay">
    <div class="text-center">
  <img src="../img/logo-interagro.png" alt="Logo" class="logo">
      <div class="spinner-border text-success" role="status"></div>
      <div class="meta">Cargando...</div>
    </div>
  </div>
  <div id="modalConstruccion" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.4);z-index:2000;align-items:center;justify-content:center;">
    <div style="background:#fff;padding:32px 40px;border-radius:18px;box-shadow:0 2px 24px #0006;max-width:90vw;text-align:center;">
      <h4 style="color:#4caf50;">Función en construcción</h4>
      <p>Esta sección estará disponible próximamente.</p>
      <button onclick="document.getElementById('modalConstruccion').style.display='none'" class="btn btn-success mt-2">Cerrar</button>
    </div>
  </div>
  <script src="../js/login.js"></script>
  <script>
function mostrarConstruccion(e) {
  if (e) e.preventDefault();
  document.getElementById('modalConstruccion').style.display = 'flex';
}
  </script>
  <script>
// Menú Más
const btnMas = document.getElementById('btnMas');
const menuMas = document.getElementById('menuMas');
btnMas.onclick = () => {
  menuMas.style.display = menuMas.style.display === 'none' ? 'block' : 'none';
};
document.addEventListener('click', (e) => {
  if (!btnMas.contains(e.target) && !menuMas.contains(e.target)) menuMas.style.display = 'none';
});

// Botones funcionales menú Más
const actividadBtn = document.getElementById('actividadBtn');
const guardadoBtn = document.getElementById('guardadoBtn');
const aparienciaBtn = document.getElementById('aparienciaBtn');
const reporteBtn = document.getElementById('reporteBtn');
const cambiarCuentaBtn = document.getElementById('cambiarCuentaBtn');
const salirBtn = document.getElementById('salirBtn');

if (actividadBtn) actividadBtn.onclick = mostrarConstruccion;
if (guardadoBtn) guardadoBtn.onclick = mostrarConstruccion;
if (reporteBtn) reporteBtn.onclick = () => {
  const panel = document.getElementById('reportePanel');
  if (panel) panel.style.display = 'block';
  else mostrarConstruccion();
};
if (aparienciaBtn) aparienciaBtn.onclick = () => {
  document.body.classList.toggle('dark-mode');
};
if (cambiarCuentaBtn) cambiarCuentaBtn.onclick = () => {
  localStorage.clear();
  window.location.href = 'login.html';
};
if (salirBtn) salirBtn.onclick = () => {
  localStorage.clear();
  window.location.href = 'login.html';
};
function mostrarConstruccion(e) {
  if (e) e.preventDefault();
  document.getElementById('modalConstruccion').style.display = 'flex';
}
  </script>
</body>
</html>
