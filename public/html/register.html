<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/register.css">
  <link rel="stylesheet" href="../css/interagro-theme.css">
</head>
<body>
  <div class="register-container">
    <div class="card p-4 mx-auto">
      <div class="text-center">
  <img src="../img/4.png" alt="Logo InterAgro" class="logo mb-3">
        <h2 class="mb-4">InterAgro</h2>
      </div>
      <div class="card p-4 fade-in">
        <form id="registerForm">
          <div class="mb-3">
            <input type="text" class="form-control" id="nombre" placeholder="Nombre completo" required>
          </div>
          <div class="mb-3">
            <input type="email" class="form-control" id="correo" placeholder="Correo electrónico" required>
          </div>
          <div class="mb-3">
            <input type="telefono" class="form-control" id="telefono" placeholder="Telefono" required>
          </div>
          <div class="mb-3">
            <input type="direccion" class="form-control" id="direccion" placeholder="Direccion" required>
          </div>
          <div class="mb-3">
            <input type="password" class="form-control" id="contrasena" placeholder="Contraseña" required>
          </div>
          <button type="submit" class="btn btn-success w-100 animated-btn">Registrarse</button>
        </form>
        <div class="mt-3 text-center">
          <a href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
      </div>
    </div>
  </div>
  <div id="loaderOverlay">
    <div class="text-center">
  <img src="../img/logo-interagro.png" alt="Logo" class="logo">
      <div class="spinner-border text-success" role="status"></div>
      <div class="meta">Cargando...</div>
    </div>
  </div>
  <script src="../js/register.js"></script>
</body>
</html>
