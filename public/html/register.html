<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InterAgro — Registro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-Gb3mgUO3VrfS7kN9WnPH6o0Txfjz7Ggl4gRbUxw3tJpJz1D9u4Boh1bYDc9R7S8Zn4xZ+Aa/lIlWCQX63rFJwQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="auth-page">
  <div class="page">
    <section class="brand-panel">
      <div class="brand-mark">Agro</div>
      <h1>Únete a la comunidad</h1>
      <p>Crea tu cuenta y empieza a descubrir productos agrícolas con estilo moderno.</p>
    </section>

    <section class="auth-card">
      <h2>Registro</h2>
      <form id="registerForm" class="form-grid">
        <label class="field">
          <span>Nombre completo</span>
          <input type="text" id="nombre" placeholder="Nombre completo" required>
        </label>
        <label class="field">
          <span>Correo</span>
          <input type="email" id="correo" placeholder="correo@ejemplo.com" required>
        </label>
        <label class="field">
          <span>Teléfono</span>
          <input type="tel" id="telefono" placeholder="300 123 4567" required>
        </label>
        <label class="field">
          <span>Dirección</span>
          <input type="text" id="direccion" placeholder="Ciudad, barrio" required>
        </label>
        <label class="field">
          <span>Contraseña</span>
          <input type="password" id="contrasena" placeholder="********" required>
        </label>
        <button type="submit" class="btn btn-primary">Registrarse</button>
      </form>
      <p class="text-center">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </section>
  </div>

  <div class="loader-overlay" id="loaderOverlay">
    <div class="loader-spinner"></div>
    <p>Cargando...</p>
  </div>

  <script src="../js/common.js" defer></script>
  <script src="../js/register-app.js" defer></script>
</body>
</html>
