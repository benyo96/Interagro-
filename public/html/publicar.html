<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicar Producto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/interagro-theme.css">
  <link rel="stylesheet" href="../css/sidebar.css">
</head>
<body>
  <div class="publicar-container">
    <div class="card p-4 mx-auto">
      <div class="text-center">
  <img src="../img/4.png" alt="Logo" class="logo">
        <h2 class="mb-4">Publicar Producto</h2>
      </div>
      <form id="publicarForm">
        <div class="mb-3">
          <input type="text" class="form-control" id="nombre_productos" placeholder="Nombre del producto" required>
        </div>
        <div class="mb-3">
          <textarea class="form-control" id="descripcion" placeholder="Descripción" rows="2" required></textarea>
        </div>
        <div class="mb-3">
          <input type="number" class="form-control" id="precio" placeholder="Precio en pesos colombianos (COP)" min="0" required>
        </div>
        <div class="mb-3">
          <label for="categoria" class="form-label">Categoría</label>
          <select class="form-select" id="categoria" required multiple>
            <option value="Frutas">Frutas</option>
            <option value="Verduras">Verduras</option>
            <option value="Cereales">Cereales</option>
            <option value="Legumbres">Legumbres</option>
            <option value="Tubérculos">Tubérculos</option>
            <option value="Plantas Aromáticas">Plantas Aromáticas</option>
            <option value="Animales">Animales</option>
            <option value="Lácteos">Lácteos</option>
            <option value="Otra">Otra...</option>
          </select>
          <input type="text" class="form-control mt-2" id="otraCategoria" placeholder="Especifique la categoría" style="display:none;">
        </div>
        <div class="mb-3">
          <label class="form-label">Ubicación del producto</label>
          <div id="miniMapa" style="height:220px;border-radius:8px;overflow:hidden;"></div>
          <input type="hidden" id="latitud" name="latitud">
          <input type="hidden" id="longitud" name="longitud">
          <div class="form-text">Arrastra el marcador para seleccionar la ubicación.</div>
        </div>
        <button type="submit" class="btn btn-success w-100">Publicar</button>
      </form>
      <div class="mt-3 text-center">
        <a href="catalogo.html">Volver al catálogo</a>
      </div>
    </div>
  </div>
  <div id="loaderOverlay">
    <div class="text-center">
  <img src="../img/logo-interagro.png" alt="Logo" class="logo">
      <div class="spinner-border text-success" role="status"></div>
      <div class="meta">Cargando...</div>
    </div>
  </div>
  <div id="modalConstruccion" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.4);z-index:2000;align-items:center;justify-content:center;">
    <div style="background:#fff;padding:32px 40px;border-radius:18px;box-shadow:0 2px 24px #0006;max-width:90vw;text-align:center;">
      <h4 style="color:#4caf50;">Función en construcción</h4>
      <p>Esta sección estará disponible próximamente.</p>
      <button onclick="document.getElementById('modalConstruccion').style.display='none'" class="btn btn-success mt-2">Cerrar</button>
    </div>
  </div>
  <!-- Leaflet.js para el mini mapa -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/publicar.js"></script>
</body>
</html>
