<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio | InterAgro</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/interagro-theme.css">
  <link rel="stylesheet" href="../css/sidebar.css">
</head>

<body>
  <!-- Menú lateral global -->
  <div id="sidebar-container"></div>
  <main class="main-content">
  <h2 class="fw-bold" style="color:#4caf50;">Bienvenido a InterAgro</h2>
  <p>Esta es la página de inicio. Aquí puedes ver información general, novedades y acceder a las demás secciones desde la barra lateral.</p>
  <div id="feedPublicaciones" style="max-width:600px;margin:40px auto 0 auto;width:100%;display:flex;flex-direction:column;gap:32px;"></div>
  </main>
  <!-- Menú Más global -->
  <button class="btn btn-dark mas-btn" id="btnMas">
    <span style="font-weight:700;">Más</span>
  </button>
  <div id="menu-mas-container"></div>
<div id="actividadPanel" style="display:none;background:#fff;padding:24px;border-radius:18px;box-shadow:0 2px 16px #0001;max-width:600px;margin:24px auto;"></div>
<div id="guardadoPanel" style="display:none;background:#fff;padding:24px;border-radius:18px;box-shadow:0 2px 16px #0001;max-width:600px;margin:24px auto;"></div>
<div id="reportePanel" style="display:none;background:#fff;padding:24px;border-radius:18px;box-shadow:0 2px 16px #0001;max-width:600px;margin:24px auto;">
  <h4>Reportar un problema</h4>
  <form id="formReporte">
    <input type="text" id="asuntoReporte" class="form-control mb-2" placeholder="Asunto" required>
    <textarea id="descReporte" class="form-control mb-2" placeholder="Describe el problema" rows="3" required></textarea>
    <button type="submit" class="btn btn-success">Enviar reporte</button>
  </form>
  <div id="reporteMsg" class="mt-2"></div>
</div>
<div id="modalConstruccion" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.4);z-index:2000;align-items:center;justify-content:center;">
  <div style="background:#fff;padding:32px 40px;border-radius:18px;box-shadow:0 2px 24px #0006;max-width:90vw;text-align:center;">
    <h4 style="color:#4caf50;">Función en construcción</h4>
    <p>Esta sección estará disponible próximamente.</p>
    <button onclick="document.getElementById('modalConstruccion').style.display='none'" class="btn btn-success mt-2">Cerrar</button>
  </div>
</div>

<script>
// Cargar menú lateral global
fetch('../html/sidebar.html')
  .then(res => res.text())
  .then(html => {
    document.getElementById('sidebar-container').innerHTML = html;
  });

// Cargar menú Más global
fetch('../html/menu-mas.html')
  .then(res => res.text())
  .then(html => {
    document.getElementById('menu-mas-container').innerHTML = html;
    // Lógica para mostrar/ocultar menú Más
    const btnMas = document.getElementById('btnMas');
    const menuMas = document.getElementById('menuMas');
    let menuMasVisible = false;
    btnMas.addEventListener('click', function(e) {
      e.stopPropagation();
      menuMas.style.display = menuMasVisible ? 'none' : 'block';
      menuMasVisible = !menuMasVisible;
    });
    document.addEventListener('click', function(e) {
      if (menuMasVisible && !menuMas.contains(e.target) && e.target !== btnMas) {
        menuMas.style.display = 'none';
        menuMasVisible = false;
      }
    });
    window.addEventListener('scroll', function() {
      if (menuMasVisible) {
        menuMas.style.display = 'none';
        menuMasVisible = false;
      }
    });
  });
</script>
<script src="../js/inicio.js"></script>
</body>
</html>
