<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración de Perfil</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/interagro-theme.css">
  <link rel="stylesheet" href="../css/sidebar.css">
</head>
<body>
  <!-- Menú lateral global -->
  <div id="sidebar-container"></div>
  <main class="main-content">
    <div class="card p-4 mx-auto" style="max-width:400px;">
      <div class="text-center">
        <img src="../img/agricultor.png" alt="Perfil" class="perfil-img">
        <h2 class="mb-2" style="color:#4caf50;font-weight:700;">Configuración</h2>
      </div>
      <div class="section-title">Datos personales</div>
      <form id="configForm">
        <div class="mb-3">
          <input type="text" class="form-control" id="nombre" placeholder="Nombre completo" required>
        </div>
        <div class="mb-3">
          <input type="email" class="form-control" id="correo" placeholder="Correo electrónico" required>
        </div>
        <div class="section-title">Contraseña y seguridad</div>
        <div class="mb-3">
          <input type="password" class="form-control" id="contrasena" placeholder="Nueva contraseña">
        </div>
        <button type="submit" class="btn btn-success w-100">Guardar cambios</button>
      </form>
      <div class="mt-3 text-center">
        <a href="catalogo.html" style="color:#4caf50;">Volver al catálogo</a>
      </div>
    </div>
  </main>
  <!-- Menú Más global -->
  <button class="btn btn-dark mas-btn" id="btnMas">
    <span style="font-weight:700;">Más</span>
  </button>
  <div id="menu-mas-container"></div>
  <div id="modalConstruccion" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.4);z-index:2000;align-items:center;justify-content:center;">
    <div style="background:#fff;padding:32px 40px;border-radius:18px;box-shadow:0 2px 24px #0006;max-width:90vw;text-align:center;">
      <h4 style="color:#4caf50;">Función en construcción</h4>
      <p>Esta sección estará disponible próximamente.</p>
      <button onclick="document.getElementById('modalConstruccion').style.display='none'" class="btn btn-success mt-2">Cerrar</button>
    </div>
  </div>
  <script>
    // Cargar datos actuales
    document.getElementById('nombre').value = localStorage.getItem('nombre') || '';
    document.getElementById('correo').value = localStorage.getItem('correo') || '';
    document.getElementById('configForm').addEventListener('submit', function(e) {
      e.preventDefault();
      // Guardar en backend
      const id_usuario = localStorage.getItem('id_usuario');
      const nombre = document.getElementById('nombre').value;
      const correo = document.getElementById('correo').value;
      const contrasena = document.getElementById('contrasena').value;
      fetch('/api/usuarios/' + id_usuario, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, correo, contrasena })
      }).then(res => {
        if (res.ok) {
          localStorage.setItem('nombre', nombre);
          localStorage.setItem('correo', correo);
          alert('Cambios guardados correctamente');
          window.location.href = 'inicio.html';
        } else {
          alert('Error al guardar los cambios');
        }
      });
    });
  </script>
  <script>
    // Cargar menú lateral global
    fetch('../html/sidebar.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('sidebar-container').innerHTML = html;
      });

    // Cargar menú Más global
    fetch('../html/menu-mas.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('menu-mas-container').innerHTML = html;
        // Lógica para mostrar/ocultar menú Más
        const btnMas = document.getElementById('btnMas');
        const menuMas = document.getElementById('menuMas');
        let menuMasVisible = false;
        btnMas.addEventListener('click', function(e) {
          e.stopPropagation();
          menuMas.style.display = menuMasVisible ? 'none' : 'block';
          menuMasVisible = !menuMasVisible;
        });
        document.addEventListener('click', function(e) {
          if (menuMasVisible && !menuMas.contains(e.target) && e.target !== btnMas) {
            menuMas.style.display = 'none';
            menuMasVisible = false;
          }
        });
        window.addEventListener('scroll', function() {
          if (menuMasVisible) {
            menuMas.style.display = 'none';
            menuMasVisible = false;
          }
        });
      });
  </script>
  <script src="../js/configuracion.js"></script>
</body>
</html>
